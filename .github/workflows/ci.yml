name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Base-branch retargeting fires `edited`, not `synchronize`; the newly applicable
    # commit range must be checked again (independent review finding R1).
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  commit-reference:
    name: Commit references
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Lint actual PR commits, not GitHub's synthetic test-merge message.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate new commit subjects and issue references offline
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$COMMIT_BASE" ]; then
            python tools/commitlint.py --base "$COMMIT_BASE"
          else
            python tools/commitlint.py
          fi

  offline:
    name: Offline contract, fixture, and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --project backend --frozen

      - name: Fixture generation is reproducible and committed files are current
        run: uv run --project backend python tools/fixturectl.py verify

      - name: Offline test suite
        run: uv run --project backend pytest backend/tests -q

      - name: Lint
        run: uv run --project backend ruff check .

      - name: Format check
        run: uv run --project backend ruff format --check .

  bdd:
    name: Cucumber acceptance suite and step-resolution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The imported report must be attributable to the selected revision, not GitHub's
          # synthetic test-merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bdd/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --project backend --frozen

      - name: Install BDD harness dependencies
        working-directory: bdd
        run: npm ci

      - name: Build the dashboard for browser acceptance
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Materialize the fixture repository used by the steps
        run: uv run --project backend python tools/fixturectl.py build

      - name: Run the acceptance suite (Cucumber Messages captured)
        working-directory: bdd
        env:
          CTA_BDD_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
          CTA_CHROME_PATH: /usr/bin/google-chrome
        run: npm run bdd

      - name: Strict step-resolution gate
        working-directory: bdd
        run: node tools/step-resolution.mjs reports/cucumber-messages.ndjson

      - name: Upload the Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-messages
          path: bdd/reports/cucumber-messages.ndjson

  frontend:
    name: Frontend build and component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Component tests
        run: npm test

  banking-assurance:
    name: Banking requirement assurance report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned backend dependencies
        run: uv sync --project backend --frozen

      - name: Build the deterministic banking fixture
        run: uv run --project backend python tools/fixturectl.py build

      - name: Evaluate baseline-b and publish the typed report
        run: |
          ASSURANCE_DIR="$RUNNER_TEMP/assurance/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ASSURANCE_DIR"
          uv run --project backend python tools/assurance.py evaluate \
            --repository banking-demo --baseline baseline-b \
            --report "$ASSURANCE_DIR/banking-report.json" \
            --manifest "$ASSURANCE_DIR/banking-manifest.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --deny-network \
            2> "$ASSURANCE_DIR/banking-diagnostic.json"

      - name: Upload the report, manifest, and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-banking
          path: |
            ${{ runner.temp }}/assurance/${{ github.run_id }}-${{ github.run_attempt }}/banking-report.json
            ${{ runner.temp }}/assurance/${{ github.run_id }}-${{ github.run_attempt }}/banking-manifest.json
            ${{ runner.temp }}/assurance/${{ github.run_id }}-${{ github.run_attempt }}/banking-diagnostic.json
          if-no-files-found: warn

  self-assurance:
    name: Portable CTA self-assurance report
    needs: bdd
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned backend dependencies
        run: uv sync --project backend --frozen

      - name: Download the acceptance report for this revision
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cucumber-messages
          path: ${{ runner.temp }}/cucumber

      - name: Evaluate the selected revision with the imported report
        env:
          TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ASSURANCE_DIR="$RUNNER_TEMP/assurance/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ASSURANCE_DIR"
          printf '{"repository_id":"gherkin-knowledge-graph","tested_commit":"%s"}' "$TESTED_COMMIT" \
            > "$ASSURANCE_DIR/self.meta.json"
          uv run --project backend python tools/assurance.py self-assure \
            --repo-root . --repository-id gherkin-knowledge-graph \
            --tested-commit "$TESTED_COMMIT" \
            --cucumber-report "$RUNNER_TEMP/cucumber/cucumber-messages.ndjson" \
            --cucumber-root bdd \
            --metadata "$ASSURANCE_DIR/self.meta.json" \
            --state-dir "$ASSURANCE_DIR/state" \
            --report "$ASSURANCE_DIR/self-report.json" \
            --manifest "$ASSURANCE_DIR/self-manifest.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --deny-network \
            2> "$ASSURANCE_DIR/self-diagnostic.json"

      - name: Upload the self-assurance report, manifest, and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-self
          path: |
            ${{ runner.temp }}/assurance/${{ github.run_id }}-${{ github.run_attempt }}/self-report.json
            ${{ runner.temp }}/assurance/${{ github.run_id }}-${{ github.run_attempt }}/self-manifest.json
            ${{ runner.temp }}/assurance/${{ github.run_id }}-${{ github.run_attempt }}/self-diagnostic.json
          if-no-files-found: warn
