[project]
name = "cta-backend"
version = "0.1.0"
description = "Continuous Traceability Assurance — domain contracts, mock services, and API (offline-first)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "gherkin-official>=43.0.0",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
