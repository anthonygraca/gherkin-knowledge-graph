# Single lint/format configuration for the whole repository.
#
# It lives at the root because linting must give identical results no matter which directory the
# command is run from: with per-package configs, files under tools/ (outside backend/) resolved no
# configuration at all and were sorted as if `app` were third-party.
#
# Fixture content is excluded on purpose: fixtures/banking-demo/tree is frozen fixture data whose
# bytes are hashed into the fixture manifest, so it must never be reformatted.

line-length = 100
target-version = "py311"
extend-exclude = ["fixtures"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
known-first-party = ["app"]
